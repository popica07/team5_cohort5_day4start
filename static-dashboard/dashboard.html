<!doctype html>
<!--
============================================================================
TICKET-ADV098 — Flexbox page shell
TICKET-ADV099 — CSS custom properties / design tokens
============================================================================
-->
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>ReconX (static) — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="app-shell">
<header class="app-header" role="banner">
  <h1 class="app-header__title">ReconX</h1>

  <nav class="app-header__nav" aria-label="Main navigation">
    <a href="dashboard.html" aria-current="page">Dashboard</a>
    <a href="trades.html">Trades</a>
    <a href="recon.html">Recon</a>
  </nav>

  <button
          id="theme-toggle"
          class="app-header__theme-toggle"
          type="button"
          aria-label="Toggle light and dark theme"
  >
    🌗
  </button>
</header>

<div class="app-body">
  <aside class="app-sidebar" role="complementary">
    <h2 class="app-sidebar__title">Quick filters</h2>

    <nav aria-label="Trade filters">
      <ul class="app-sidebar__list">
        <li><a href="#">All trades</a></li>
        <li><a href="#">Open breaks</a></li>
        <li><a href="#">Today</a></li>
      </ul>
    </nav>
  </aside>

  <main class="app-main" role="main">
    <section aria-labelledby="kpi-heading">
      <h2 id="kpi-heading">Today at a glance</h2>

      <div class="dashboard-grid">
        <article class="stat-card">
          <h3 class="stat-card__title">Trades</h3>
          <p class="stat-card__value">120</p>
        </article>

        <article class="stat-card">
          <h3 class="stat-card__title">Matched</h3>
          <p class="stat-card__value">105</p>
        </article>

        <article class="stat-card stat-card--warning">
          <h3 class="stat-card__title">Open breaks</h3>
          <p class="stat-card__value">15</p>
        </article>
      </div>
    </section>

    <section class="feed-section" aria-labelledby="feed-heading">
      <h2 id="feed-heading">Live trade feed</h2>

      <div
              id="trade-feed"
              class="trade-feed"
              role="status"
              aria-live="polite"
              aria-atomic="false"
      ></div>
    </section>
  </main>
</div>

<footer class="app-footer" role="contentinfo">
  <small>ReconX TDI 2026 · static dashboard (Day 7)</small>
</footer>

<script src="js/theme.js"></script>
<script src="js/sse.js"></script>
</body>
</html>
